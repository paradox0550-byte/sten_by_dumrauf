<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  (function () {
    try {
      var mode = localStorage.getItem('sten_theme_v5') || 'light';
      var resolved = mode === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : (mode === 'light' || mode === 'dark' ? mode : 'light');
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.style.colorScheme = resolved;
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.style.colorScheme = 'light';
    }
  })();
</script>
<style>
  html { background: var(--bg-base, #F7F8FA); }
  html[data-theme="light"] { background: var(--bg-base, #F7F8FA); }
  html[data-theme="dark"] { background: var(--bg-base, #0C1216); }
</style>
<meta name="theme-color" content="#F7F8FA" id="dumrauf-theme-color"><meta name="description" content="Dumrauf — Calm Intelligence. Исполнительный контур управления ресторанным бизнесом.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9.0.0"><link rel="apple-touch-icon" href="./icon-192.svg?v=9.0.0"><link rel="manifest" href="./manifest.json?v=9.0.0">
<title>Dumrauf — Calm Intelligence</title>
<style>
.topbar  { view-transition-name: dumrauf-topbar; }
.sidebar { view-transition-name: dumrauf-sidebar; }
.content { view-transition-name: dumrauf-content; }
@keyframes dumrauf-view-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dumrauf-view-slide-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
::view-transition-old(dumrauf-content) { animation: 120ms ease dumrauf-view-fade-in reverse; }
::view-transition-new(dumrauf-content) { animation: 220ms ease dumrauf-view-slide-up; }
::view-transition-old(dumrauf-sidebar),
::view-transition-new(dumrauf-sidebar),
::view-transition-old(dumrauf-topbar),
::view-transition-new(dumrauf-topbar) { animation-duration: 0.001ms; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(dumrauf-content),
  ::view-transition-new(dumrauf-content) { animation: none; }
}
</style>
<style id="dumrauf-critical-css">
html,body,#root{min-height:100%;margin:0}
html{background:var(--bg-base,#F7F8FA);color:var(--text-primary,#101828);font-family:var(--font-ui,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)}
body{min-width:320px;line-height:1.5}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.sten-loading{box-sizing:border-box;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:var(--bg-base,#f3f5f7);color:var(--text-primary,#17212b)}
.sten-state-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-secondary,#475467)}
.sten-loading-message{font-size:14px;color:var(--text-secondary,#475569)}
.login-screen{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:100dvh;background:var(--bg-base,#f3f5f7);color:var(--text-primary,#17212b)}
.login-form-panel{display:grid;place-items:center;min-width:0;padding:32px 24px;background:var(--bg-surface,#fff)}
.login-form-wrap{width:min(100%,380px)}
.login-heading{margin-bottom:28px}
.login-heading h1{margin:10px 0 7px;font-size:20px;line-height:1.25;font-weight:600}
.login-heading p{color:var(--text-muted,#667085);font-size:13px;line-height:1.5}
.login-field input{box-sizing:border-box;width:100%;min-width:0;height:44px;padding:0 12px;border:1px solid var(--border-default,#D0D5DD);border-radius:var(--ui-radius-md,8px);background:var(--bg-base,#f3f5f7);color:var(--text-primary,#17212b)}
@media(max-width:760px){.login-screen{grid-template-columns:minmax(0,1fr)}.login-brand-panel{display:none}.login-form-panel{padding:24px 20px}}
</style>
</head><body><div id="root"></div><script type="module" src="./src/main.tsx"></script></body></html>
