            ╨б╤Ж╨╡╨╜╨░╤А╨╕╨╣, ╨╛╨┐╤А╨╡╨┤╨╡╨╗╤С╨╜╨╜╤Л╨╣ ╤Д╤А╨╛╨╜╤В╨╛╨╝.
            ╨Я╤А╨╕╨╝╨╡╤А╤Л: food_cost_up, revenue_down, payroll_up, pnl_analysis.
