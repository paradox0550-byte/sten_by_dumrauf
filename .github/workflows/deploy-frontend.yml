name: Deploy Frontend to Yandex Object Storage

on:
  workflow_run:
    workflows: ["STEN CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload frontend
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://d5d5p4eof6ra03bsva7a.nnekmrav.apigw.yandexcloud.net
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Upload assets (JS)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: smenavkarmane-business
        run: |
          set -e
          for f in dist/assets/*.js; do
            name=$(basename "$f")
            aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$f" "s3://$BUCKET/assets/$name" --content-type "application/javascript; charset=utf-8"
          done

      - name: Upload assets (CSS)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: smenavkarmane-business
        run: |
          set -e
          for f in dist/assets/*.css; do
            name=$(basename "$f")
            aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$f" "s3://$BUCKET/assets/$name" --content-type "text/css; charset=utf-8"
          done

      - name: Upload assets (fonts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: smenavkarmane-business
        run: |
          set -e
          shopt -s nullglob
          fonts=(dist/assets/*.woff2 dist/assets/*.woff dist/assets/*.ttf)
          if [ ${#fonts[@]} -eq 0 ]; then
            echo "❌ No font files emitted into dist/assets; expected Inter WOFF2/WOFF/TTF assets."
            exit 1
          fi
          for f in "${fonts[@]}"; do
            name=$(basename "$f")
            case "$name" in
              *.woff2) type="font/woff2" ;;
              *.woff) type="font/woff" ;;
              *.ttf) type="font/ttf" ;;
            esac
            aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$f" "s3://$BUCKET/assets/$name" --content-type "$type" --cache-control "public, max-age=31536000, immutable"
          done

      - name: Upload brand assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: smenavkarmane-business
        run: |
          set -e
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync dist/brand "s3://$BUCKET/brand" --content-type "image/svg+xml"

      - name: Upload navigation icons
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: smenavkarmane-business
        run: |
          set -e
          test -d dist/icons
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync dist/icons "s3://$BUCKET/icons" --content-type "image/svg+xml"

      - name: Upload root files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
          BUCKET: smenavkarmane-business
        run: |
          set -e
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type "text/html; charset=utf-8"
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/manifest.json "s3://$BUCKET/manifest.json" --content-type "application/manifest+json"
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/sw.js "s3://$BUCKET/sw.js" --content-type "application/javascript; charset=utf-8"
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/favicon.svg "s3://$BUCKET/favicon.svg" --content-type "image/svg+xml"
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/icon-192.svg "s3://$BUCKET/icon-192.svg" --content-type "image/svg+xml"
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp dist/icon-512.svg "s3://$BUCKET/icon-512.svg" --content-type "image/svg+xml"

      - name: Smoke test
        run: |
          set -e
          URL="https://smenavkarmane-business.website.yandexcloud.net/"
          echo "Checking $URL"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL")
          echo "Status: $code"
          if [ "$code" != "200" ]; then
            echo "❌ Smoke test failed: $code"
            exit 1
          fi
          index_file=$(mktemp)
          trap 'rm -f "$index_file"' EXIT
          curl -fsS "$URL" -o "$index_file"
          assets=$(grep -oE '(src|href)="\./assets/[^"]+\.(js|css)(\?[^"]*)?"' "$index_file" | cut -d '"' -f 2 | sort -u)
          if [ -z "$assets" ]; then
            echo "❌ No versioned JS/CSS assets found in production HTML"
            exit 1
          fi
          while IFS= read -r asset; do
            asset_code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL${asset#./}")
            echo "$asset: $asset_code"
            if [ "$asset_code" != "200" ]; then
              echo "❌ Referenced build asset failed: $asset"
              exit 1
            fi
          done <<< "$assets"
          # Verify every emitted font is reachable at the same URL used by CSS.
          shopt -s nullglob
          fonts=(dist/assets/*.woff2 dist/assets/*.woff dist/assets/*.ttf)
          if [ ${#fonts[@]} -eq 0 ]; then
            echo "❌ No font assets available for production smoke test"
            exit 1
          fi
          for f in "${fonts[@]}"; do
            asset="assets/$(basename "$f")"
            asset_code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL$asset")
            echo "$asset: $asset_code"
            if [ "$asset_code" != "200" ]; then
              echo "❌ Font asset failed: $asset"
              exit 1
            fi
          done
          # Keep explicit checks for stable brand and navigation assets.
          for asset in favicon.svg icon-192.svg icon-512.svg icons/favicon.svg icons/ic_overview.svg icons/ic_pnl.svg icons/ic_report.svg icons/ic_settings.svg icons/ic_staff.svg icons/ic_terms.svg brand/sten-mark.svg brand/sten-lockup.svg; do
            asset_code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL$asset")
            echo "$asset: $asset_code"
            if [ "$asset_code" != "200" ]; then
              echo "❌ Asset smoke test failed: $asset"
              exit 1
            fi
          done
          echo "✅ Smoke test passed"
