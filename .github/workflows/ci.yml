name: STEN CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: STEN validation only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime
        run: |
          set -euo pipefail
          node --version
          npm --version
          git --version

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        env:
          VITE_API_URL: https://d5d5p4eof6ra03bsva7a.nnekmrav.apigw.yandexcloud.net
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -d dist/assets
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/favicon.svg
          test -f dist/icon-192.svg
          test -f dist/icon-512.svg
          test -f dist/brand/sten-mark.svg
          test -f dist/brand/sten-lockup.svg
          test -f dist/icons/favicon.svg
          test -f dist/icons/ic_overview.svg
          test -f dist/icons/ic_pnl.svg
          test -f dist/icons/ic_report.svg
          test -f dist/icons/ic_settings.svg
          test -f dist/icons/ic_staff.svg
          test -f dist/icons/ic_terms.svg

      - name: Backend validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci --omit=dev
          node --check index.js
          node --check documentProcessor.js
          npm test
          test -f package-lock.json

      - name: MarkItDown validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          test -f backend/markitdown/function.py
          test -f backend/markitdown/requirements.txt
          grep -q "markitdown\[all\]==0.1.8" backend/markitdown/requirements.txt
          python3 -m py_compile backend/markitdown/function.py

      - name: Architecture integrity
        run: |
          set -euo pipefail
          test ! -d node_modules/.cache/stencil
          ! grep -RInE 'process\.env\.(JWT_SECRET|UNLOCK_CODE_HASH|YANDEXGPT_API_KEY|DB_PASSWORD|AWS_SECRET_ACCESS_KEY)' src public
          ! grep -RInE 'from .*(pg|sequelize|mysql2|knex)|require\(.{0,20}(pg|sequelize|mysql2|knex)' src
          ! grep -RInE 'fetch\(.{0,200}(yandexgpt|foundationModels|llm\.api|ai\.api\.cloud)' src
          ! grep -RInE 'localhost:11434|127\.0\.0\.1:11434|OLLAMA|ollama|qwen2\.5|DASHSCOPE_API_KEY|QWEN_API_KEY' src public

      - name: Static integrity
        run: |
          set -euo pipefail
          grep -q 'src="./assets/' dist/index.html
          ! grep -q 'Перейти к содержимому' index.html
          ! grep -RInE 'QWEN_API_KEY|DASHSCOPE_API_KEY|YANDEXGPT_API_KEY|OLLAMA_BASE_URL' src public
          ! grep -RInE 'localhost:11434|127\.0\.0\.1:11434|OLLAMA|ollama|qwen2\.5|DASHSCOPE_API_KEY|QWEN_API_KEY' src public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sten-frontend-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
