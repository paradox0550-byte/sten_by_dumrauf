name: STEN CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: STEN validation only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime
        run: |
          set -euo pipefail
          node --version
          npm --version
          git --version

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        env:
          VITE_API_URL: https://d5d5p4eof6ra03bsva7a.nnekmrav.apigw.yandexcloud.net
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -d dist/assets
          test -f dist/manifest.json
          test -f dist/sw.js

      - name: Backend validation
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci --omit=dev
          node --check index.js
          node --check documentProcessor.js
          npm test
          test -f package-lock.json

      - name: MarkItDown validation
        run: |
          set -euo pipefail
          test -f backend/markitdown/function.py
          test -f backend/markitdown/requirements.txt
          grep -q "markitdown\[all\]==0.1.8" backend/markitdown/requirements.txt
          python3 -m py_compile backend/markitdown/function.py

      - name: Architecture integrity
        run: |
          set -euo pipefail
          test ! -d node_modules/.cache/stencil
          ! grep -RInE 'process\.env\.(JWT_SECRET|UNLOCK_CODE_HASH|YANDEXGPT_API_KEY|DB_PASSWORD|AWS_SECRET_ACCESS_KEY)' src public
          ! grep -RInE 'from .*(pg|sequelize|mysql2|knex)|require\(.{0,20}(pg|sequelize|mysql2|knex)' src
          ! grep -RInE 'fetch\(.{0,200}(yandexgpt|foundationModels|llm\.api|ai\.api\.cloud)' src
          ! grep -RInE 'localhost:11434|127\.0\.0\.1:11434|OLLAMA|ollama|qwen2\.5|DASHSCOPE_API_KEY|QWEN_API_KEY' src public .github/agent/*.py .github/agent/auto-agent.yml

      - name: Static integrity
        run: |
          set -euo pipefail
          grep -q 'src="./assets/' dist/index.html
          ! grep -q 'Перейти к содержимому' index.html
          ! grep -RInE 'QWEN_API_KEY|DASHSCOPE_API_KEY|YANDEXGPT_API_KEY|OLLAMA_BASE_URL' src public
          ! grep -RInE 'localhost:11434|127\.0\.0\.1:11434|OLLAMA|ollama|qwen2\.5|DASHSCOPE_API_KEY|QWEN_API_KEY' src public .github/agent/*.py .github/agent/auto-agent.yml
          grep -RInE 'YANDEXGPT_API_KEY|YANDEXGPT_FOLDER_ID|gpt://\$\{?FOLDER_ID|ai\.api\.cloud\.yandex\.net' .github/agent/*.py .github/agent/auto-agent.yml >/dev/null
          ! grep -RIn --exclude-dir=node_modules -E 'AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}' backend src public .github
          ! grep -RInE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' backend/index.js
          ! grep -RIn '/debug' backend/index.js
          grep -q '/api/analytics/settings:' docs/API_GATEWAY_SPEC_2026-09-29.yaml
          ! grep -q '/debug/db:' docs/API_GATEWAY_SPEC_2026-09-29.yaml
          ! grep -q '/auth/login:' docs/API_GATEWAY_SPEC_2026-09-29.yaml
          grep -q 'gateway_service_account_id' docs/API_GATEWAY_SPEC_2026-09-29.yaml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sten-frontend-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy boundary assertion
        run: |
          set -euo pipefail
          ! grep -RInE 'yc serverless|api-gateway update|aws s3 (cp|sync)|put-bucket-website|YC_SA_JSON|YC_DEPLOY_SA_ID|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY' .github/workflows
          echo "CI is validation-only. No Yandex Cloud deployment is performed."
