name: Deploy STEN backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  FUNCTION_NAME: smenavkarmane-api
  FUNCTION_RUNTIME: nodejs22
  FUNCTION_ENTRYPOINT: index.handler
  FUNCTION_MEMORY: 256Mb
  FUNCTION_TIMEOUT: "90"
  FUNCTION_NETWORK_ID: ${{ vars.YC_NETWORK_ID }}

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: |
          set -euo pipefail
          node --check index.js
          node --check documentProcessor.js
          node --check markitdownClient.js
          node --check core/skills.js
          npm test

  deploy:
    name: Deploy Cloud Function
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (prod only)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Verify required files exist
        working-directory: backend
        run: |
          set -euo pipefail
          test -f index.js              || (echo "❌ index.js missing" && exit 1)
          test -f documentProcessor.js  || (echo "❌ documentProcessor.js missing" && exit 1)
          test -f markitdownClient.js   || (echo "❌ markitdownClient.js missing" && exit 1)
          test -f core/skills.js        || (echo "❌ core/skills.js missing" && exit 1)
          test -f package.json          || (echo "❌ package.json missing" && exit 1)
          test -d node_modules          || (echo "❌ node_modules missing" && exit 1)
          echo "✅ All required files present"
          
      - name: Build function.zip
        run: |
          set -euo pipefail
          cd backend
          rm -f ../function.zip
          zip -r ../function.zip . \
            -x "tests/*" \
            -x "*.md" \
            -x ".env*" \
            -x "*.bak*" \
            -x "*.test.js"
          echo "----- zip content (top-level) -----"
          unzip -l ../function.zip | head -60
          echo "----- checking core/skills.js in zip -----"
          unzip -l ../function.zip | grep -E 'core/skills\.js' || (echo "❌ core/skills.js not in zip" && exit 1)

      - name: Get Yandex IAM token
        id: yc-iam
        uses: yc-actions/yc-iam-token-fed@v1
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}

      - name: Deploy function version
        id: deploy
        uses: yc-actions/yc-sls-function@v5
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
          yc-iam-token: ${{ steps.yc-iam.outputs.token }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          function-name: ${{ env.FUNCTION_NAME }}
          runtime: ${{ env.FUNCTION_RUNTIME }}
          memory: ${{ env.FUNCTION_MEMORY }}
          entrypoint: ${{ env.FUNCTION_ENTRYPOINT }}
          execution-timeout: ${{ env.FUNCTION_TIMEOUT }}
          source-path: ./function.zip
          service-account-name: github-deployer
          network-id: ${{ env.FUNCTION_NETWORK_ID }}
          tags: |
            ${{ github.sha }}
            $latest
          environment: |
            NODE_ENV=production
            ALLOWED_ORIGINS=https://smenavkarmane-business.website.yandexcloud.net,https://cabinet.smenavkarmane.ru,https://smenavkarmane.ru,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,https://d5d5p4eof6ra03bsva7a.nnekmrav.apigw.yandexcloud.net
            CORS_ORIGIN=https://smenavkarmane-business.website.yandexcloud.net
            OBJECT_STORAGE_BUCKET=smenavkarmane-business
            OBJECT_STORAGE_ENDPOINT=https://storage.yandexcloud.net
            OBJECT_STORAGE_REGION=ru-central1
            YC_BUCKET_NAME=smenavkarmane-business
            YANDEXGPT_MODEL=yandexgpt
            YANDEXGPT_BASE_URL=https://llm.api.cloud.yandex.net/foundationModels/v1
            YANDEXGPT_TIMEOUT_MS=60000
            YANDEXGPT_MAX_TOKENS=8000
            YANDEXGPT_TEMPERATURE=0.2
            VISION_OCR_URL=https://ocr.api.cloud.yandex.net/ocr/v1/recognizeText
            MARKITDOWN_URL=${{ vars.MARKITDOWN_URL }}
            MARKITDOWN_ENABLED=${{ vars.MARKITDOWN_ENABLED }}
            MARKITDOWN_TIMEOUT_MS=60000
            DB_HOST=${{ vars.YC_DB_HOST }}
            DB_PORT=${{ vars.YC_DB_PORT }}
            DB_NAME=${{ vars.YC_DB_NAME }}
            DB_USER=${{ vars.YC_DB_USER }}
            YC_FOLDER_ID=${{ vars.YC_FOLDER_ID }}
            JWT_TTL_SECONDS=2592000
            PNL_APPROVER_ROLES=super_admin,admin,director,owner
            DEFAULT_ORG_ID=${{ vars.YC_DEFAULT_ORG_ID }}
            ADMIN_ROLE=super_admin
            ADMIN_EMAIL=${{ vars.YC_ADMIN_EMAIL }}
            ADMIN_ID=${{ vars.YC_ADMIN_ID }}
            DEBUG=0
          secrets: |
            JWT_SECRET=${{ secrets.YC_LOCKBOX_JWT_SECRET }}
            UNLOCK_CODE_HASH=${{ secrets.YC_LOCKBOX_UNLOCK_CODE }}
            DB_PASSWORD=${{ secrets.YC_LOCKBOX_DB_PASSWORD }}
            YANDEXGPT_API_KEY=${{ secrets.YC_LOCKBOX_YANDEXGPT_API_KEY }}
            AWS_ACCESS_KEY_ID=${{ secrets.YC_LOCKBOX_AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.YC_LOCKBOX_AWS_SECRET_ACCESS_KEY }}
            MARKITDOWN_TOKEN=${{ secrets.YC_LOCKBOX_MARKITDOWN_TOKEN }}

      - name: Production smoke test
        env:
          API_URL: ${{ vars.YC_API_GATEWAY_URL }}
        run: |
          set -euo pipefail
          echo "🔍 Smoke test on $API_URL/healthz..."
          for i in 1 2 3 4 5; do
            if curl -fsS "$API_URL/healthz" >/tmp/health.json; then
              echo "✅ Backend is healthy:"
              cat /tmp/health.json
              exit 0
            fi
            echo "⏳ Attempt $i failed, retrying in 4s..."
            sleep 4
          done
          echo "❌ Smoke test failed after 5 attempts"
          exit 1
